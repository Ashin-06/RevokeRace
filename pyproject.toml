[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "revokerace"
version = "1.0.0"
description = "Measure revoked-access exposure under outages and clock rollback."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ashin Murugan"}]
dependencies = []

[project.scripts]
revokerace = "revokerace.entry:main"

[tool.setuptools.packages.find]
include = ["revokerace*"]

[tool.setuptools.package-data]
revokerace = ["static/*"]
